<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahmoud Mahran</title>
    
    <!-- أيقونة التاب -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4,26 L4,6 L10,6 L16,16 L22,6 L28,6 L28,26 L23,26 L23,12 L17.5,21 L14.5,21 L9,12 L9,26 Z' fill='%23888888'/%3E%3C/svg%3E">

    <!-- خطوط وأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        
        <!-- حاوية الصورة والفيديو معاً بنفس المقاس والبرواز -->
        <div class="profile-img-container">
            <img src="profile.jpeg" alt="محمود مهران" class="profile-img" id="profile-img">
            <video id="profile-video" src="intro.mp4" playsinline preload="auto" muted></video>
            <div class="fade-overlay" id="fade-overlay"></div>
        </div>

        <!-- محتوى الكارت الداخلي -->
        <div class="card-content" id="card-content">
            
            <h1 class="name">Mahmoud Mahran</h1>
            
            <!-- المسمى الوظيفي بدون أسهم -->
            <div class="title-container" id="title-container">
                <h2 class="title">IT-System-Elektroniker</h2>
                <div class="title-details" id="title-details">
                    <p>Auszubildender bei der <strong>PKE Deutschland GmbH</strong></p>
                </div>
            </div>

            <!-- زر الاتصال -->
            <button id="contact-btn" class="cta-button">Contact Me</button>

            <!-- قسم الأيقونات -->
            <div class="social-icons" id="social-icons">
                <a href="https://wa.me/491781359127" target="_blank" class="whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="tel:+491781359127" class="phone"><i class="fa-solid fa-phone"></i></a>
                <a href="mailto:mahmuud.mahran@gmail.com" class="email"><i class="fa-solid fa-envelope"></i></a>
                <a href="https://instagram.com/mahmoudelrawy" target="_blank" class="instagram"><i class="fa-brands fa-instagram"></i></a>
            </div>
            
            <p class="tagline">© 2026 Mahmoud Mahran. All Rights Reserved.</p>
            
        </div>

    </div>

<script>
    // زر Contact Me مع التمرير
    const contactBtn = document.getElementById('contact-btn');
    const socialIcons = document.getElementById('social-icons');

    contactBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        socialIcons.classList.toggle('show');

        if (socialIcons.classList.contains('show')) {
            setTimeout(() => {
                socialIcons.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100); 
        }
    });

    // إظهار تفاصيل الوظيفة بالنقر
    const titleContainer = document.getElementById('title-container');
    const titleDetails = document.getElementById('title-details');

    titleContainer.addEventListener('click', (e) => {
        e.stopPropagation();
        titleDetails.classList.toggle('show');
    });

    document.addEventListener('click', () => {
        socialIcons.classList.remove('show');
    });

    // ميزة الـ Easter Egg (انزلاق النصوص وتحول الصورة لفيديو في نفس مكانها)
    const profileImg = document.getElementById('profile-img');
    const profileVideo = document.getElementById('profile-video');
    const cardContent = document.getElementById('card-content');
    const fadeOverlay = document.getElementById('fade-overlay');

    let tapCount = 0;
    let tapTimer = null;

    profileImg.addEventListener('click', () => {
        tapCount++;
        
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => {
            tapCount = 0;
        }, 1000);

        if (tapCount === 5) {
            tapCount = 0;
            
            // 1. سحب النصوص لأسفل بنعومة وإخفاء التدرج
            if (cardContent) cardContent.classList.add('slide-down');
            if (fadeOverlay) fadeOverlay.style.opacity = '0';

            // 2. إخفاء الصورة وعرض الفيديو في نفس المكان بالضبط
            profileImg.style.display = 'none';
            profileVideo.style.display = 'block';
            profileVideo.currentTime = 0;
            profileVideo.play();
        }
    });

    // العودة للوضع الطبيعي فور انتهاء الفيديو
    profileVideo.addEventListener('ended', () => {
        profileVideo.style.display = 'none';
        profileImg.style.display = 'block';
        if (cardContent) cardContent.classList.remove('slide-down');
        if (fadeOverlay) fadeOverlay.style.opacity = '1';
    });
</script>
</body>
</html>
